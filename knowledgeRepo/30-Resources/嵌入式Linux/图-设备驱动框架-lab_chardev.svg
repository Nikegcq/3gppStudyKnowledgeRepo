<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f9e44"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0c8599"/>
    </marker>
    <marker id="arrK" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#495057"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e03131"/>
    </marker>
  </defs>
  <rect width="1100" height="820" fill="#ffffff"/>

  <text x="550" y="36" text-anchor="middle" font-size="28" font-weight="600" fill="#1e1e1e">设备驱动框架</text>
  <text x="550" y="62" text-anchor="middle" font-size="12" fill="#868e96">用户空间 open/read/write/close → 系统调用 → VFS → file_operations → 驱动 → 硬件</text>

  <text x="50" y="110" font-size="14" fill="#1e1e1e">应用程序</text>
  <text x="50" y="128" font-size="14" fill="#1e1e1e">open()</text>
  <line x1="80" y1="140" x2="80" y2="175" stroke="#495057" stroke-width="2" marker-end="url(#arrK)"/>
  <text x="30" y="198" font-size="13" fill="#1e1e1e">vfs(.sys_open())</text>
  <line x1="90" y1="210" x2="90" y2="250" stroke="#495057" stroke-width="2" marker-end="url(#arrK)"/>
  <text x="40" y="272" font-size="13" fill="#1e1e1e">file_operations</text>
  <text x="50" y="290" font-size="13" fill="#1e1e1e">.open</text>
  <line x1="90" y1="302" x2="90" y2="350" stroke="#495057" stroke-width="2" marker-end="url(#arrK)"/>
  <text x="40" y="372" font-size="13" fill="#2f9e44">驱动程序</text>
  <text x="40" y="390" font-size="13" fill="#2f9e44">lab_open()</text>
  <text x="30" y="430" font-size="11" fill="#868e96">(.read/.write/.release</text>
  <text x="30" y="446" font-size="11" fill="#868e96">同理分发)</text>

  <rect x="220" y="90" width="420" height="150" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="240" y="115" font-size="16" fill="#1971c2" font-weight="600">用户空间</text>
  <text x="240" y="145" font-size="13" fill="#1e1e1e">应用程序 open()</text>
  <text x="360" y="138" font-size="12" fill="#495057">多线程编程</text>
  <rect x="360" y="150" width="90" height="30" rx="4" fill="#fff" stroke="#1971c2"/>
  <text x="378" y="170" font-size="12">Pthread</text>
  <text x="470" y="138" font-size="12" fill="#495057">GUI 编程</text>
  <rect x="470" y="150" width="70" height="30" rx="4" fill="#fff" stroke="#1971c2"/>
  <text x="490" y="170" font-size="12">QT</text>
  <text x="240" y="205" font-size="12" fill="#868e96">进程编程 / Shell 编程</text>
  <text x="240" y="228" font-size="11" fill="#1e1e1e">fd=open("/dev/lab0",O_RDWR)  read()  write()  close()</text>

  <text x="680" y="110" font-size="13" fill="#c0392b">fd=open("/dev/lab0", O_RDWR)</text>
  <text x="680" y="135" font-size="13" fill="#c0392b">read(fd, ...)</text>
  <text x="680" y="160" font-size="13" fill="#c0392b">write(fd, ...)</text>
  <text x="680" y="185" font-size="13" fill="#c0392b">close(fd)</text>
  <text x="680" y="220" font-size="14" fill="#c0392b" font-weight="600">系统调用</text>

  <path d="M740,115 C700,180 580,220 540,280" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M720,140 C690,200 580,250 540,310" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M720,165 C690,220 580,280 540,340" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M700,190 C670,240 570,300 540,370" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="220" y="250" width="420" height="280" rx="8" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
  <text x="240" y="275" font-size="16" fill="#343a40" font-weight="600">内核空间</text>

  <rect x="380" y="280" width="220" height="120" rx="6" fill="#fff" stroke="#0c8599" stroke-width="2"/>
  <text x="475" y="300" text-anchor="middle" font-size="15" fill="#0c8599" font-weight="600">VFS</text>
  <text x="410" y="325" font-size="13">.sys_open();</text>
  <text x="410" y="348" font-size="13">.sys_read();</text>
  <text x="410" y="371" font-size="13">.sys_write();</text>
  <text x="410" y="394" font-size="13">.sys_close();</text>

  <rect x="300" y="420" width="300" height="95" rx="6" fill="#fff" stroke="#2f9e44" stroke-width="2"/>
  <text x="315" y="442" font-size="12" fill="#2f9e44">文件操作集 file_operations {</text>
  <text x="330" y="465" font-size="12">.open     = lab_open,</text>
  <text x="330" y="485" font-size="12">.read     = lab_read,</text>
  <text x="330" y="505" font-size="12">.write    = lab_write,</text>
  <text x="330" y="520" font-size="12">.release  = lab_release,</text>

  <line x1="490" y1="400" x2="450" y2="420" stroke="#0c8599" stroke-width="2" marker-end="url(#arrB)"/>

  <text x="620" y="330" font-size="12" fill="#868e96">虚拟地址</text>
  <text x="620" y="348" font-size="12" fill="#868e96">(VA)</text>

  <rect x="680" y="280" width="200" height="90" rx="6" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <text x="760" y="305" text-anchor="middle" font-size="15" fill="#e67700" font-weight="600">module</text>
  <text x="700" y="330" font-size="13">设计的驱动</text>
  <text x="700" y="350" font-size="13">lab_chardev.ko</text>

  <line x1="680" y1="320" x2="600" y2="430" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="615" y="360" font-size="12" fill="#2f9e44">insmod</text>
  <text x="605" y="376" font-size="11" fill="#2f9e44">(注册 fops)</text>

  <line x1="600" y1="470" x2="680" y2="350" stroke="#e03131" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <text x="600" y="420" font-size="12" fill="#e03131">rmmod</text>

  <line x1="450" y1="515" x2="450" y2="555" stroke="#2f9e44" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrG)"/>
  <text x="460" y="540" font-size="11" fill="#2f9e44">驱动回调实现</text>

  <rect x="220" y="580" width="420" height="110" rx="8" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
  <text x="240" y="605" font-size="16" fill="#343a40" font-weight="600">硬件</text>
  <text x="240" y="635" font-size="13">GPIO_ADDRESS / 外设寄存器</text>
  <text x="240" y="660" font-size="13" fill="#c0392b">物理地址 PA   例：0x0200280</text>
  <text x="240" y="680" font-size="11" fill="#868e96">(SoC/板级外设基址 + 偏移)</text>

  <text x="680" y="575" font-size="13" fill="#c0392b">VA = ioremap(PA)</text>
  <path d="M760,585 C700,600 600,610 560,635" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <line x1="400" y1="515" x2="340" y2="580" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="515" x2="500" y2="580" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="560" y1="515" x2="560" y2="580" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="510" y="560" font-size="11" fill="#c0392b">readl/writel</text>

  <rect x="880" y="400" width="160" height="70" rx="6" fill="#fff" stroke="#868e96" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="900" y="425" font-size="12" fill="#495057">虚拟地址 VA</text>
  <text x="895" y="448" font-size="11" fill="#868e96">驱动用 VA 访问</text>
  <text x="895" y="464" font-size="11" fill="#868e96">物理寄存器</text>
  <line x1="880" y1="435" x2="780" y2="435" stroke="#868e96" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrK)"/>

  <text x="40" y="740" font-size="13" fill="#495057" font-weight="600">图例：</text>
  <line x1="100" y1="735" x2="150" y2="735" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="160" y="740" font-size="12" fill="#868e96">系统调用 / 硬件访问</text>
  <line x1="340" y1="735" x2="390" y2="735" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="400" y="740" font-size="12" fill="#868e96">insmod 注册</text>
  <line x1="520" y1="735" x2="570" y2="735" stroke="#e03131" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrR)"/>
  <text x="580" y="740" font-size="12" fill="#868e96">rmmod 卸载</text>
  <line x1="700" y1="735" x2="750" y2="735" stroke="#0c8599" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="760" y="740" font-size="12" fill="#868e96">VFS → fops 分发</text>

  <text x="40" y="780" font-size="11" fill="#868e96">符号与 plutosdr-fw/modules/lab_chardev.c 一致；课堂原图为 led_* 示例。</text>
</svg>
